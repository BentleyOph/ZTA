<!-- FILE: ZeroTrustWebUI/templates/enterSecretKey.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Enter Secret Key</title>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="container bg-white p-8 rounded-xl shadow-2xl max-w-md w-full">
        <h2 class="text-3xl font-bold text-gray-800 text-center mb-6">Enter Secret Key</h2>
        <p class="text-gray-600 text-center mb-8">Please enter the secret key generated from the approval process to access the protected resource.</p>

        <form method="POST" action="{{ url_for('process_secret_key') }}" class="space-y-6">
            <div>
                <label for="secret_key" class="block text-sm font-medium text-gray-700 mb-1">Secret Key:</label>
                <input type="text" id="secret_key" name="secret_key" required
                       class="appearance-none block w-full px-4 py-3 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
            </div>

            <div>
                <input type="submit" value="Submit Key"
                       class="w-full flex justify-center py-3 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 cursor-pointer">
            </div>
        </form>
    </div>
</body>
</html>
